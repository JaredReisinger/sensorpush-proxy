version: "3"

dotenv: ['.env']

vars:
  APP_NAME: sensorpush-proxy
  APP_EXE: "{{.APP_NAME}}{{exeExt}}"
  BUILD_DIR: build
  APP_PORT: 5375
  COVERAGE_DIR: ./coverage

# env:
#   APP_NAME: sensorpush-proxy
#   BUILD_DIR: build

tasks:
  default:
    cmds:
      - go tool task --list

  # The git hooks initialization isn't quite as streamlined as in Node/npm,
  # where the package creator can "force install" the husky hooks during the
  # "npm install" stage (which is a necessary precursor to doing any sort of
  # development).  To approximate that, we have a "prepare" task that does the
  # equivalent one-time local repo setup.  (Except for "task" itself, which is
  # an annoying chicken-and-egg problem.)
  prepare:
    desc: One-time local repo setup
    cmds:
      - go mod download
      - echo "setting up git hooks..."
      - git config set --local core.hooksPath .hooks
      - echo "setting up committed as this repo's commit editor..."
      - git config set --local core.editor "go tool committed"
      - echo "use 'git config unset --local core.editor' to undo"

  clean:
    desc: Clean project
    cmds:
      - rm -rf {{.COVERAGE_DIR}}
      - rm -rf .task

  builddir:
    cmds:
      - mkdir {{.BUILD_DIR}}
    status:
      - test -d {{.BUILD_DIR}}

  update:
    desc: Updates all dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  build:
    desc: Builds the {{.APP_NAME}} binary
    sources:
      - ./**/*.go
    deps:
      - builddir
    cmds:
      - go get
      - go generate -v
      - go build -ldflags '-d -s -w -X main.version=x.y.z -X main.commit=1234567890 -X main.date=now' -tags netgo -o {{.BUILD_DIR}}/{{.APP_EXE}} .

  coveragedir:
    desc: Create coverage directory
    cmds:
      - mkdir {{.COVERAGE_DIR}}
    status:
      - test -d {{.COVERAGE_DIR}}

  test:
    desc: Runs all the tests
    deps:
      - coveragedir
    vars:
      COVERAGE_FILE: '{{.COVERAGE_DIR}}/coverage.out'
    cmds:
      - go test -coverprofile {{.COVERAGE_FILE}} ./...
      - go tool cover -html {{.COVERAGE_FILE}} -o {{.COVERAGE_DIR}}/coverage.html

  lint:
    desc: Runs common checks/vet/linting
    cmds:
      - go fmt -n ./...
      - go vet ./...
      - go tool govulncheck ./...

  pre-commit:
    cmds:
      - task: lint

  tag-release:
    desc: tags the next release if warranted (and on CI)
    vars:
      VER_CUR:
        sh: go tool svu current
      VER_NEXT:
        sh: go tool svu next
    cmds:
      - cmd: echo "svu says {{.VER_CUR}} -> {{.VER_NEXT}}"
        silent: true
      - if: '{{ne .VER_NEXT .VER_CUR}}'
        task: tag-release:ci
        vars:
          VERSION: '{{.VER_NEXT}}'
      - if: '{{eq .VER_NEXT .VER_CUR}}'
        cmd: echo "no new tag created"
        silent: true

  # note that tag-release:ci must be run with permissions to write to the
  # contents of the repo
  tag-release:ci:
    internal: true
    preconditions:
      - sh: '[ "${CI}" == "true" ]'
    requires:
      vars: [ VERSION ]
    cmds:
      - git config user.name "github-actions[bot]"
      - git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - git tag -a "{{.VERSION}}" -m "release {{.VERSION}}"
      - git push --tags
      - echo "do_release=true" >> "${GITHUB_OUTPUT}"
      - echo "version={{.VERSION}}" >> "${GITHUB_OUTPUT}"

  release:test:
    desc: test the release process
    cmds:
      # "go get -tool github.com/goreleaser/goreleaser/v2" is failing because
      # "github.com/gobwas/glob" no longer has "syntax/ast" (as of v1.0) and
      # we're already dependent on v1.1; for now, "goreleaser", not "go tool
      # goreleaser"
      - goreleaser release --clean --snapshot --skip=publish {{.CLI_ARGS}}
      # - goreleaser release --clean --snapshot --skip=publish --skip=sign --skip=sbom {{.CLI_ARGS}}

  # note that release must be run with permissions to write to the
  # artifacts and releases of the repo
  release:
    desc: actually release the tool
    preconditions:
      - sh: '[ "${CI}" == "true" ]'
    cmds:
      # - goreleaser release --release-notes /tmp/release-notes.md --clean
      - goreleaser release --clean

  query:
    desc: Runs the {{.TASK}} command directly from source
    cmds:
      - task: run
        vars:
          CMD_NAME: '{{.TASK}}'

  proxy:
    desc: Runs the {{.TASK}} command directly from source
    cmds:
      - task: run
        vars:
          CMD_NAME: '{{.TASK}}'

  run:
    desc: Runs the command directly from source
    cmds:
      - go run . {{.CMD_NAME}} {{.CLI_ARGS}}

  docker-query:
    desc: Runs the {{ .TASK | replace "docker-" "" }} command via the Docker image
    cmds:
      - task: docker-run
        vars:
          SPP_ARGS: '{{ .TASK | replace "docker-" "" }}'

  docker-proxy:
    desc: Runs the {{ .TASK | replace "docker-" "" }} command via the Docker image
    cmds:
      - task: docker-run
        vars:
          RUN_ARGS: -p {{.APP_PORT}}:{{.APP_PORT}}
          SPP_ARGS: '{{ .TASK | replace "docker-" "" }}'

  docker-run:
    internal: true
    cmds:
      # if you have a local config.yaml, it will be mounted in the /tmp dir;
      # uses the goreleaser-built image
      - docker run --rm -ti -v {{.ROOT_DIR}}:/tmp --workdir /tmp {{.RUN_ARGS}} jaredreisinger/{{.APP_NAME}}:latest-{{ARCH}} {{.SPP_ARGS}}

  docker-analyze:
    cmds:
      - docker build -f Dockerfile.analyze -t analyze:local .
      - docker run --rm -ti analyze:local

  docker-analyze-arm64:
    cmds:
      - docker build -f Dockerfile.analyze -t analyze:local --build-arg IMAGE_ARCH=arm64 .
      - docker run --rm -ti analyze:local

  check:
    desc: Calls a running proxy to get the JSON payload
    # precondition isn't checked?
    precondition: which http
    cmds:
      - http -v :{{.APP_PORT}}/sensors

  # cacerts:
  #   desc: Retrieve the CA cert bundle
  #   deps:
  #     - builddir
  #   cmds:
  #     - curl --etag-compare {{.BUILD_DIR}}/etag.txt --etag-save {{.BUILD_DIR}}/etag.txt --output {{.BUILD_DIR}}/cacert.pem https://curl.se/ca/cacert.pem

