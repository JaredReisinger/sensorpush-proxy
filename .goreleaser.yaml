version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

# gomod/proxy to enable verifiable builds
# see https://goreleaser.com/customization/verifiable_builds/
gomod:
  proxy: true
  env:
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org
  mod: mod

builds:
  - env:
      - CGO_ENABLED=0
    tags:
      - netgo
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - '{{ if eq .Os "linux" }}-d{{ end }}'

signs:
  # NOTE: on GitHub, we might be able to omit the password (stdin) and --key,
  # and it will magically use our GitHub-verified ID?  No idea what the public
  # value would be in that case.  Bad docs!
  - cmd: cosign
    stdin: '{{ .Env.COSIGN_PASSWORD }}'
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --key=cosign.key
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: all

dockers_v2:
  - images:
      - jaredreisinger/sensorpush-proxy
    tags:
      - '{{ .Version }}'
      - '{{ .Major }}.{{ .Minor }}'
      - '{{ .Major }}'
      - latest

archives:
  - formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      sensorpush-proxy_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: false
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

