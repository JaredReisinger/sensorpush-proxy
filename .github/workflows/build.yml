name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run lint, test, and build
        run: |
          go mod download
          go tool task lint
          go tool task test
          go tool task build

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-latest

    # write changelog at some point?
    # permissions:
    #   attestations: write
    #   contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check if release is needed
        id: check-bump
        run: |
          go mod download
          go tool task tag-release


      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - uses: sigstore/cosign-installer@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: cycjimmy/semantic-release-action@v4
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec

      # kick the Go package index with the new version
      - run: |
          curl https://proxy.golang.org/github.com/jaredreisinger/sensorpush-proxy/@v/${{ steps.release.outputs.new_release_git_tag }}.info

      - uses: act10ns/slack@v2
        if: always()
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
