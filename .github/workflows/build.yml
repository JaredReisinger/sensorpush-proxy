name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run lint, test, and build
        run: |
          go mod download
          go tool task lint
          go tool task test
          go tool task build

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # also upload the coverage to codacy
      - name: Upload test coverage to Codacy
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report --force-coverage-parser go -r .coverage/coverage.out
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-latest

    permissions:
      # attestations: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run semrel release
        id: semrel
        run: |
          go mod download
          git config user.name "SemRel Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go tool semrel release --github-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # install the GoReleaser/signing/docker tooling

      - if: steps.semrel.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true

      - if: steps.semrel.outputs.released == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - if: steps.semrel.outputs.released == 'true'
        name: Set up signing keys
        run: |
          printf "%s" '${{ secrets.COSIGN_PRIVATE_KEY }}' > cosign.key

      - if: steps.semrel.outputs.released == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: steps.semrel.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.semrel.outputs.released == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.semrel.outputs.released == 'true'
        run: |
          echo "Preparing release notes for GoReleaser..."
          printf "%s" "${{ steps.semrel.outputs.changelog }}" > .RELEASE-NOTES.md
          go tool task release -- --release-notes .RELEASE-NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - if: always()
        run: |
          rm -f cosign.key

      # kick the Go package index with the new version
      - if: steps.semrel.outputs.released == 'true'
        run: |
          curl "https://proxy.golang.org/github.com/jaredreisinger/sensorpush-proxy/@v/${{ steps.semrel.outputs.tag }}.info"

      - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: always()
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
