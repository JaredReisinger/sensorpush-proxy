name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run lint, test, and build
        run: |
          go mod download
          go tool task lint
          go tool task test
          go tool task build

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-latest

    # write changelog at some point?
    # permissions:
    #   attestations: write
    #   contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check if release is needed
        id: check-bump
        run: |
          go mod download
          go tool task tag-release

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        uses: sigstore/cosign-installer@v4.1.3

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        name: Set up signing keys
        run: |
          printf "%s" '${{ secrets.COSIGN_PRIVATE_KEY }}' > cosign.key

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - uses: cycjimmy/semantic-release-action@v8
      #   id: release
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      #   with:
      #     extra_plugins: |
      #       @semantic-release/changelog
      #       @semantic-release/git
      #       @semantic-release/exec

      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        run: go tool task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: always()
        run: |
          rm -f cosign.key

      # kick the Go package index with the new version
      - if: ${{ steps.check-bump.outputs.do_release == 'true' }}
        run: |
          curl https://proxy.golang.org/github.com/jaredreisinger/sensorpush-proxy/@v/${{ steps.check-bump.outputs.version }}.info

      - uses: act10ns/slack@v2
        if: always()
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
